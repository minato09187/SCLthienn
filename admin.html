<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quản lý sân cầu lông - Admin</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js"
            }
        }
    </script>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <a href="index.html" class="back-btn">🏸 Về trang chủ</a>
        </div>
        <h1>🎛️ Quản Lý Sân Cầu Lông</h1>
        <div class="admin-header-right">
            <div class="notification-bell" id="notifBell">
                🔔 <span id="notifBadge" class="badge"></span>
            </div>
            <button id="adminLogoutBtn" style="background:#ef4444">Đăng xuất</button>
        </div>
    </div>

    <!-- Form đăng nhập admin (hiện khi chưa đăng nhập) -->
    <div id="adminLoginDiv" class="admin-login-box">
        <h3>🔐 Đăng nhập quản trị</h3>
        <input type="password" id="adminPassword" placeholder="Nhập mật khẩu quản trị">
        <button id="adminLoginBtn">Đăng nhập</button>
    </div>

    <!-- Nội dung admin (hiện sau khi đăng nhập) -->
    <div id="adminContent" style="display:none">
        <!-- Tab menu -->
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="courts">🏸 Quản lý sân</button>
            <button class="admin-tab" data-tab="shop">🛒 Quản lý shop</button>
            <button class="admin-tab" data-tab="orders">📦 Quản lý đơn hàng</button>
        </div>

        <!-- Tab Quản lý sân -->
        <div id="courtsTab" class="admin-tab-content active">
            <div class="admin-controls">
                <div class="date-control">
                    <label>📅 Chọn ngày: <input type="date" id="datePicker"></label>
                </div>
                <div class="admin-actions">
                    <button id="toggleDeleteBtn">🗑️ Xóa sân (admin)</button>
                    <button id="confirmDeleteBtn">✔️ Xác nhận xóa</button>
                </div>
            </div>
            <div id="adminTable"></div>
        </div>

        <!-- Tab Quản lý shop -->
        <div id="shopTab" class="admin-tab-content" style="display:none">
            <div class="shop-manager">
                <div class="add-product-form">
                    <h3>➕ Thêm sản phẩm mới</h3>
                    <div class="form-group">
                        <input type="text" id="productName" placeholder="Tên sản phẩm">
                        <select id="productCategory">
                            <option value="shuttlecock">🏸 Cầu lông</option>
                            <option value="racket">🏓 Vợt cầu lông</option>
                            <option value="net">🥅 Lưới cầu lông</option>
                            <option value="shirt">👕 Áo cầu lông</option>
                            <option value="shoes">👟 Giày cầu lông</option>
                        </select>
                        <input type="number" id="productPrice" placeholder="Giá tiền (VNĐ)">
                        <input type="number" id="productStock" placeholder="Số lượng trong kho">
                        <button id="addProductBtn">➕ Thêm sản phẩm</button>
                    </div>
                </div>
                
                <div class="product-list">
                    <h3>📦 Danh sách sản phẩm</h3>
                    <div id="productsList"></div>
                </div>
            </div>
        </div>

        <!-- Tab Quản lý đơn hàng -->
        <div id="ordersTab" class="admin-tab-content" style="display:none">
            <div class="orders-manager">
                <h3>📋 Đơn hàng chờ xử lý</h3>
                <div id="ordersList"></div>
            </div>
        </div>
    </div>
</div>

<!-- Panel thông báo -->
<div class="notification-panel" id="notificationPanel"></div>
<div id="toastMsg" class="toast"></div>

<script type="module" src="admin.js"></script>
</body>
</html>
