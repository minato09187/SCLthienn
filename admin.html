<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quan ly san cau long - Admin</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js"
            }
        }
    </script>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <a href="index.html" class="back-btn">Ve trang chu</a>
        </div>
        <h1>Quan Ly San Cau Long</h1>
        <div class="admin-header-right">
            <div class="notification-bell" id="notifBell">
                🔔 <span id="notifBadge" class="badge"></span>
            </div>
            <button id="adminLogoutBtn" style="background:#ef4444">Dang xuat</button>
        </div>
    </div>

    <div id="adminLoginDiv" class="admin-login-box">
        <h3>Dang nhap quan tri</h3>
        <input type="password" id="adminPassword" placeholder="Nhap mat khau quan tri">
        <button id="adminLoginBtn">Dang nhap</button>
    </div>

    <div id="adminContent" style="display:none">
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="courts">Quan ly san</button>
            <button class="admin-tab" data-tab="shop">Quan ly shop</button>
            <button class="admin-tab" data-tab="orders">Quan ly don hang</button>
        </div>

        <div id="courtsTab" class="admin-tab-content active">
            <div class="admin-controls">
                <div class="date-control">
                    <label>Chon ngay: <input type="date" id="datePicker"></label>
                </div>
                <div class="admin-actions">
                    <button id="toggleDeleteBtn">Xoa san (admin)</button>
                    <button id="confirmDeleteBtn">Xac nhan xoa</button>
                </div>
            </div>
            <div id="adminTable"></div>
        </div>

        <div id="shopTab" class="admin-tab-content" style="display:none">
            <div class="shop-manager">
                <p>Quan ly shop - Them chuc nang sau</p>
            </div>
        </div>

        <div id="ordersTab" class="admin-tab-content" style="display:none">
            <div class="orders-manager">
                <p>Quan ly don hang - Them chuc nang sau</p>
            </div>
        </div>
    </div>
</div>

<!-- Panel thong bao -->
<div class="notification-panel" id="notificationPanel">
    <div style="padding: 12px;">Dang tai thong bao...</div>
</div>

<div id="toastMsg" class="toast"></div>

<script type="module" src="admin.js"></script>
</body>
</html>
