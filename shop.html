<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shop Cầu Lông - Weplay</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <a href="index.html" class="back-btn">🏸 Đặt sân</a>
            <a href="shop.html" class="shop-nav-btn active">🛒 Shop</a>
        </div>
        <h1>🛒 Shop Cầu Lông</h1>
        <div id="authButtons" class="auth-buttons">
            <button id="showLoginBtn">Đăng nhập</button>
            <button id="showRegisterBtn">Đăng ký</button>
        </div>
        <div id="userInfo" class="user-info" style="display:none">
            <span>👤 <span id="userNameDisplay"></span></span>
            <button id="cartBtn" class="cart-icon">🛒 <span id="cartCount">0</span></button>
            <button id="logoutBtn">Đăng xuất</button>
        </div>
    </div>

    <div class="category-tabs">
        <button class="category-btn active" data-category="shuttlecock">Hộp cầu lông</button>
        <button class="category-btn" data-category="racket">🏸 Vợt cầu lông</button>
        <button class="category-btn" data-category="net">Lưới cầu lông</button>
        <button class="category-btn" data-category="shirt">👕 Áo cầu lông</button>
        <button class="category-btn" data-category="shoes">👟 Giày cầu lông</button>
    </div>

    <div id="productsContainer" class="products-grid">
        <div style="text-align: center; padding: 40px;">Đang tải sản phẩm...</div>
    </div>
</div>

<!-- Modal giỏ hàng -->
<div id="cartModal" class="modal">
    <div class="modal-content cart-modal">
        <h3>🛒 Giỏ hàng của bạn</h3>
        <div id="cartItems"></div>
        <div class="cart-total">
            <strong>Tổng tiền: <span id="cartTotal">0</span>đ</strong>
        </div>
        <button id="checkoutBtn" class="checkout-btn">✅ Xác nhận đặt hàng</button>
        <button id="closeCartBtn">Đóng</button>
    </div>
</div>

<!-- Modal nhập địa chỉ -->
<div id="addressModal" class="modal">
    <div class="modal-content">
        <h3>📦 Thông tin giao hàng</h3>
        <input type="text" id="addressInput" placeholder="Nhập địa chỉ giao hàng">
        <button id="submitOrderBtn">Gửi đơn hàng</button>
        <button id="closeAddressBtn">Đóng</button>
    </div>
</div>

<!-- Modal đăng nhập -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h3>🔐 Đăng nhập</h3>
        <input id="loginPhone" placeholder="Số điện thoại">
        <div style="position: relative;">
            <input id="loginPwd" type="password" placeholder="Mật khẩu" style="padding-right: 50px; width: 100%;">
            <button type="button" id="togglePasswordBtn" style="position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 18px; cursor: pointer; padding: 5px 10px;">👁️</button>
        </div>
        <button id="loginSubmit">Đăng nhập</button>
        <p>Chưa có tài khoản? <a href="#" id="gotoRegisterLink">Đăng ký ngay</a></p>
        <button id="closeLoginModal">Đóng</button>
    </div>
</div>

<!-- Modal đăng ký -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <h3>📝 Đăng ký</h3>
        <input id="regName" placeholder="Biệt danh">
        <input id="regPhone" placeholder="Số điện thoại (10-11 số)">
        <input id="regPwd" type="password" placeholder="Mật khẩu (6+ ký tự, gồm chữ và số)">
        <input id="regConfirmPwd" type="password" placeholder="Nhập lại mật khẩu">
        <button id="registerSubmit">Đăng ký</button>
        <p>Đã có tài khoản? <a href="#" id="gotoLoginLink">Đăng nhập</a></p>
        <button id="closeRegisterModal">Đóng</button>
    </div>
</div>

<div id="toastMsg" class="toast"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script src="cart.js"></script>
</body>
</html>
